name: Build and deploy to SiteGround

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fastisol-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate production build configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [[ -z "$VITE_SUPABASE_URL" || -z "$VITE_SUPABASE_ANON_KEY" ]]; then
            echo "::error::VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY must be configured as production secrets."
            exit 1
          fi

      - name: Build
        env:
          VITE_SITE_URL: https://fastisol.it
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_GTM_CONTAINER_ID: ${{ secrets.VITE_GTM_CONTAINER_ID }}
          VITE_META_PIXEL_ID: ${{ secrets.VITE_META_PIXEL_ID }}
          VITE_CONTACT_FORM_ENDPOINT: ${{ secrets.VITE_CONTACT_FORM_ENDPOINT }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CALENDAR_ID: ${{ secrets.VITE_GOOGLE_CALENDAR_ID }}
          VITE_MANAGEMENT_USERNAME: ${{ secrets.VITE_MANAGEMENT_USERNAME }}
          VITE_MANAGEMENT_EMAIL: ${{ secrets.VITE_MANAGEMENT_EMAIL }}
        run: npm run build

      - name: Validate production artifact
        run: |
          test -f dist/index.html
          test -f dist/gestionale-shell.html
          test -f dist/404.html
          test -f dist/.htaccess
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          if find dist -type f -name '*.map' -print -quit | grep -q .; then
            echo "::error::Unexpected source maps found in dist."
            exit 1
          fi

      - name: Validate SiteGround configuration
        env:
          SITEGROUND_HOST: ${{ secrets.SITEGROUND_HOST }}
          SITEGROUND_USERNAME: ${{ secrets.SITEGROUND_USERNAME }}
          SITEGROUND_PASSWORD: ${{ secrets.SITEGROUND_PASSWORD }}
          SITEGROUND_PORT: ${{ secrets.SITEGROUND_PORT }}
          SITEGROUND_REMOTE_PATH: ${{ secrets.SITEGROUND_REMOTE_PATH }}
        run: |
          for variable in SITEGROUND_HOST SITEGROUND_USERNAME SITEGROUND_PASSWORD SITEGROUND_PORT SITEGROUND_REMOTE_PATH; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::$variable is not configured."
              exit 1
            fi
          done
          if [[ ! "$SITEGROUND_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::SITEGROUND_PORT must be numeric."
            exit 1
          fi
          if [[ "$SITEGROUND_REMOTE_PATH" == *$'\n'* || "$SITEGROUND_REMOTE_PATH" == *'"'* ]]; then
            echo "::error::SITEGROUND_REMOTE_PATH contains unsupported characters."
            exit 1
          fi

      - name: Install FTP client
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy dist contents via FTPS
        env:
          SITEGROUND_HOST: ${{ secrets.SITEGROUND_HOST }}
          SITEGROUND_USERNAME: ${{ secrets.SITEGROUND_USERNAME }}
          SITEGROUND_PASSWORD: ${{ secrets.SITEGROUND_PASSWORD }}
          SITEGROUND_PORT: ${{ secrets.SITEGROUND_PORT }}
          SITEGROUND_REMOTE_PATH: ${{ secrets.SITEGROUND_REMOTE_PATH }}
        run: |
          lftp \
            -u "$SITEGROUND_USERNAME","$SITEGROUND_PASSWORD" \
            -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:timeout 15; set net:max-retries 2; mirror -R --verbose dist $SITEGROUND_REMOTE_PATH; bye" \
            "ftp://$SITEGROUND_HOST:$SITEGROUND_PORT"
